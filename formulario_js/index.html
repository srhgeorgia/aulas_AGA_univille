<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média | Início</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="conteudo-home">
        <section class="banner-home">
            <h1>Formulário de Média</h1>
            <p>Calcule a média de notas dos seus alunos de forma rápida e fácil:</p>

            <button type="button" class="btn-destaque" onclick="abrirModal()">
                Iniciar Cálculo
            </button>
        </section>
    </main>

    <div id="modal-nome" class="modal-overlay">
        <div class="modal-conteudo">
            <span class="btn-fechar" onclick="fecharModal()">&times;</span>

            <h2>Identificação</h2>
            <p>Informe o nome do aluno antes de continuar:</p>

            <form onsubmit="salvarNomeEAvancar(event)">
                <div class="campo-input">
                    <label for="nome-aluno">Nome do Aluno:</label>
                    <input 
                        type="text" 
                        id="nome-aluno" 
                        placeholder="Ex: Maria Silva" 
                        required
                    >
                </div>

                <button type="submit" class="btn-destaque">Avançar para Notas →</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
